<!DOCTYPE html>
<html lang="pt">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanessa Portfólio | Dice Roller </title>


    <!-- Icon -->
    <link rel="icon" href="../../public/icons/butterfly.svg" type="image/svg+xml">

    <!-- CSS -->
    <link rel="stylesheet" href="../../public/css/main.css">
    <link rel="stylesheet" href="css/diceStyles.css">

</head>

<body>
    <!-- ========= NAVBAR ========= -->
    <nav class="navbar">
        <ul class="navbar-menu">
            <!-- LEFT -->
            <li class="navbar-left">
                <a href="../../index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="mailto:v.pereira.work@gmail.com" class="contact">
                    Contact Me
                </a>
            </li>

            <!-- CENTER -->
            <li id="MyClockDisplay" class="clock"></li>

            <!-- RIGHT -->
            <li class="navbar-right">
                <a href="https://www.linkedin.com/in/vanessa-pereira/" class="linkedin-btn" target="_blank"
                    rel="noopener">
                    <img src="../../public/icons/linkedin-logo.svg" alt="LinkedIn" class="linkedin-logo">

                </a>

                <a href="https://github.com/vanessappereira" class="github-btn" target="_blank" rel="noopener">

    <main class="page-container">
        <!-- Page Title -->
        <h1 class="page-title"> Dice 🎲 Roller </h1>
        <p id="result" class="dice-result">Press the button to roll 🎲</p>

        <!-- Main Content -->
        <div class="container-dice">

            <div class="dice">
                <p class="player">Player 1</p>
                <img class="img1" src="images/dice6.png" alt="Dice Player 1">
            </div>

            <div class="dice">
                <p class="player">Player 2</p>
                <img class="img2" src="images/dice6.png" alt="Dice Player 2">
            </div>
            <br>
            <button class="buttonDice" onclick="rollDice()">Press Me!</button>

        </div>

    </main>
    <!-- Footer -->
    <footer>
        <p class="footer-content">&copy; 2025 Vanessa Pereira</p>
    </footer>

    <!-- JavaScript -->
    <script src="./../../public/js/clock.js" defer></script>
